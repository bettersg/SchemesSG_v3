name: PR Quality

on:
  pull_request:
    branches:
      - stg
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests with coverage (120s budget)
        working-directory: frontend
        shell: bash
        run: |
          lane_started_at=$(date +%s)
          set +e
          timeout --kill-after=10s 120s npm run test:coverage
          lane_status=$?
          set -e
          lane_duration=$(( $(date +%s) - lane_started_at ))
          echo "Frontend unit/integration coverage: ${lane_duration}s / 120s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$lane_status" -eq 124 ] || [ "$lane_status" -eq 137 ]; then
            echo "::error title=Frontend unit/integration runtime budget exceeded::Coverage tests reached the 120s limit. Run 'npm run test:coverage' in frontend and profile the slowest files."
            exit 1
          fi
          if [ "$lane_status" -ne 0 ]; then
            echo "::error title=Frontend unit/integration tests failed::Coverage tests failed after ${lane_duration}s. See the Vitest output above."
            exit "$lane_status"
          fi

      - name: Build against the public fixture API
        working-directory: frontend
        run: |
          npm run test:build-fixture
          npm run build:public

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Chromium tests (120s budget)
        working-directory: frontend
        shell: bash
        run: |
          lane_started_at=$(date +%s)
          set +e
          timeout --kill-after=10s 120s npm run test:e2e -- --project=chromium --project=mobile-narrow-chromium
          lane_status=$?
          set -e
          lane_duration=$(( $(date +%s) - lane_started_at ))
          echo "Frontend Chromium E2E (desktop + Pixel 10): ${lane_duration}s / 120s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$lane_status" -eq 124 ] || [ "$lane_status" -eq 137 ]; then
            echo "::error title=Frontend E2E runtime budget exceeded::Desktop and Pixel 10 Chromium tests reached the 120s limit. Run 'npm run test:e2e' in frontend and inspect the slowest tests and traces."
            exit 1
          fi
          if [ "$lane_status" -ne 0 ]; then
            echo "::error title=Frontend E2E tests failed::Desktop and Pixel 10 Chromium tests failed after ${lane_duration}s. See Playwright output and uploaded failure artifacts."
            exit "$lane_status"
          fi

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-${{ github.event.pull_request.number }}-chromium-failure-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "backend/.python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version-file: "backend/.python-version"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run tests and enforce coverage ratchet
        working-directory: backend
        run: |
          uv run --frozen pytest
          uv run --frozen coverage json -o - | uv run --frozen python scripts/check_coverage.py
