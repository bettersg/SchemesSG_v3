name: Nightly browser coverage

on:
  schedule:
    # 02:17 Asia/Singapore. Off the top of the hour to reduce runner delays.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: Cross-browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install ${{ matrix.browser }}
        working-directory: frontend
        run: npm exec -- playwright install --with-deps "${{ matrix.browser }}"

      - name: Run ${{ matrix.browser }} smoke journeys
        working-directory: frontend
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          lane_started_at=$(date +%s)
          set +e
          timeout --kill-after=10s 120s npm run test:e2e:nightly -- --project="$BROWSER"
          lane_status=$?
          set -e
          lane_duration=$(( $(date +%s) - lane_started_at ))
          echo "Nightly ${BROWSER} smoke: ${lane_duration}s / 120s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$lane_status" -eq 124 ] || [ "$lane_status" -eq 137 ]; then
            echo "::error title=Cross-browser runtime budget exceeded::${BROWSER} smoke reached the 120s limit. Run 'npm run test:e2e:nightly -- --project=${BROWSER}' in frontend."
            exit 1
          fi
          if [ "$lane_status" -ne 0 ]; then
            echo "::error title=Cross-browser smoke failed::${BROWSER} smoke failed after ${lane_duration}s. Run 'npm run test:e2e:nightly -- --project=${BROWSER}' in frontend and inspect the retained artifacts."
            exit "$lane_status"
          fi

      - name: Upload cross-browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.browser }}-failure-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  staging-smoke:
    name: Deployed staging smoke (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Check staging availability and configuration
        working-directory: frontend
        shell: bash
        run: |
          phase_started_at=$(date +%s)
          set +e
          timeout --kill-after=10s 120s npm exec -- playwright test --config=playwright.staging.config.ts --project=staging-availability
          phase_status=$?
          set -e
          phase_duration=$(( $(date +%s) - phase_started_at ))
          echo "Staging availability/configuration: ${phase_duration}s / 120s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$phase_status" -eq 124 ] || [ "$phase_status" -eq 137 ]; then
            echo "::error title=Staging availability/configuration runtime budget exceeded::The availability gate reached the 120s limit. Run 'npm exec -- playwright test --config=playwright.staging.config.ts --project=staging-availability' in frontend."
            exit 1
          fi
          if [ "$phase_status" -ne 0 ]; then
            echo "::error title=Staging availability/configuration failed::The deployed staging gate failed after ${phase_duration}s. Product assertions were not run. Run 'npm exec -- playwright test --config=playwright.staging.config.ts --project=staging-availability' in frontend."
            exit "$phase_status"
          fi

      - name: Run read-only staging product assertions
        working-directory: frontend
        shell: bash
        run: |
          phase_started_at=$(date +%s)
          set +e
          timeout --kill-after=10s 120s npm exec -- playwright test --config=playwright.staging.config.ts --project=staging-product --no-deps
          phase_status=$?
          set -e
          phase_duration=$(( $(date +%s) - phase_started_at ))
          echo "Staging product assertions: ${phase_duration}s / 120s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$phase_status" -eq 124 ] || [ "$phase_status" -eq 137 ]; then
            echo "::error title=Staging product runtime budget exceeded::The read-only product assertions reached the 120s limit. Run 'npm exec -- playwright test --config=playwright.staging.config.ts --project=staging-product --no-deps' in frontend."
            exit 1
          fi
          if [ "$phase_status" -ne 0 ]; then
            echo "::error title=Staging product assertions failed::Availability/configuration passed, but product assertions failed after ${phase_duration}s. Run 'npm exec -- playwright test --config=playwright.staging.config.ts --project=staging-product --no-deps' in frontend."
            exit "$phase_status"
          fi

      - name: Upload staging failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-failure-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/staging/
            frontend/test-results/staging/
          if-no-files-found: warn
          retention-days: 7
