name: Frontend PR Build

on:
    pull_request:
        branches:
            - stg
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-pr-build.yml"

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              working-directory: frontend
              run: npm ci
            - name: Build frontend
              working-directory: frontend
              env:
                  APP_ENV: staging
                  NEXT_PUBLIC_API_BASE_URL: https://asia-southeast1-schemessg-v3-dev.cloudfunctions.net
              run: npm run build:local
