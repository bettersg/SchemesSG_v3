[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Keep runtime dependencies in sync with functions/requirements.txt.
    "ddgs>=9.6.1",
    "firebase-admin>=6.0.0",
    "firebase-functions~=0.5.0",
    "flask-cors==5.0.0",
    "flask==3.0.3",
    "google-cloud-firestore==2.22.0",
    "langchain>=1.3.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langfuse>=4.6.1",
    "langgraph>=1.2.1",
    "loguru==0.7.2",
    "lxml==5.3.0",
    "lxml-html-clean>=0.4.0",
    "numpy==1.26.2",
    "pandas==2.2.2",
    "pydantic>=2.10",
    "python-dotenv==1.0.1",
    "rank-bm25==0.2.2",
    "requests>=2.32.5",
    "slack-sdk==3.33.1",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "ruff>=0.9.4",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E741", "F402", "F823" ]
select = ["C", "E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"src/transformers/file_utils.py" = ["F401"]
"src/transformers/utils/dummy_*.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["transformers"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["functions"]
addopts = '-ra --strict-config --strict-markers --cov=functions --cov-report=term-missing --no-cov-on-fail -m "not smoke"'
markers = [
    "unit: isolated tests with no external services",
    "integration: handler and component tests with external boundaries replaced",
    "smoke: opt-in tests against explicitly configured non-production services",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
omit = [
    "functions/__init__.py",
    "functions/main.py",
    "functions/*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
